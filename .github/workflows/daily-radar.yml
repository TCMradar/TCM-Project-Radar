name: TCMRadar Daily

on:
workflow_dispatch:
schedule:
- cron: "0 5 * * *"

jobs:
scan:
runs-on: ubuntu-latest

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.12"

- name: Test TCMRadar
run: |
echo "TCMRadar scanner gestart"
python --version
ls -la
echo "Data map:"
ls -la data
echo "TCMRadar test OK"
